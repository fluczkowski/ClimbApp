apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: boulderai-ingress
spec:
  ingressClassName: nginx
  rules:
  - host: api.boulderai.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: backend-api-service
            port:
              number: 80
  - host: app.boulderai.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-ui-service
            port:
              number: 80