services:
  backend-api:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    
  frontend-ui:
    build: ./frontend
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env.production
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend-api